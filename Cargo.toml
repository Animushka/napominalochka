[package]
name = "extremely-naggy-bot"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "A Telegram reminder bot that keeps nagging until you acknowledge."
publish = false

[dependencies]
anyhow = "1"
aes-gcm = "0.10.3"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
interim = { version = "0.2.1", features = ["chrono_0_4"] }
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "throttle"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tzf-rs = { version = "2", default-features = false, features = ["bundled"] }
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
