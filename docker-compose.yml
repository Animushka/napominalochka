services:
  napominalochka:
    image: ${NAPOMINALOCHKA_IMAGE:-napominalochka:local}
    build: .
    container_name: napominalochka
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${WEB_PORT:-8097}:8080"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.75"
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
